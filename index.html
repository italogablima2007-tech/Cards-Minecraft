<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reinos & Batalhas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <h1>⚔️ REINOS & BATALHAS ⚔️</h1>

        <p>Escolha seu Reino</p>

        <div class="reinos">

            <button onclick="entrarReino('Drakmor')">
                ❄️ DRAKMOR
            </button>

            <button onclick="entrarReino('Solaris')">
                ☀️ SOLARIS
            </button>

            <button onclick="entrarReino('Aetheryon')">
                ☁️ AETHERYON
            </button>

        </div>

        <div class="admin">

            <button onclick="abrirAdmin()">
                ⚙️ ADMIN
            </button>

        </div>

        <div id="login-admin" class="login-admin">

            <h2>🔐 Acesso Administrativo</h2>

            <input
                type="password"
                id="senha-admin"
                placeholder="Digite a senha"
            >

            <button onclick="entrarAdmin()">
                Entrar
            </button>

            <p id="erro-senha"></p>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
