<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reinos & Batalhas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <h1>⚔️ REINOS & BATALHAS ⚔️</h1>

        <p>Escolha seu Reino e informe seu código secreto • Admin usa e-mail e senha</p>

        <div class="reinos">

            <button onclick="entrarReino('Drakmor')">
                ❄️ DRAKMOR
            </button>

            <button onclick="entrarReino('Solaris')">
                ☀️ SOLARIS
            </button>

            <button onclick="entrarReino('Aetheryon')">
                ☁️ AETHERYON
            </button>

        </div>

        <div id="login-reino" style="display:none;margin:18px auto;padding:18px;max-width:360px;border:1px solid #888;border-radius:12px">
          <h2 id="reino-escolhido">Código do Reino</h2>
          <input id="codigo-reino" type="password" placeholder="Código secreto do reino" autocomplete="current-password" style="width:100%;box-sizing:border-box;margin:10px 0;padding:12px" />
          <button onclick="confirmarReino()">Entrar no reino</button>
        </div>
        <p id="erro-reino" role="alert"></p>

        <div class="admin">

            <button onclick="abrirAdmin()">
                ⚙️ ADMIN
            </button>

        </div>

        <div id="login-admin" class="login-admin">

            <h2>🔐 Acesso Administrativo</h2>

            <input type="email" id="email-admin" placeholder="E-mail do administrador" autocomplete="username" required>

            <input
                type="password"
                id="senha-admin"
                placeholder="Digite a senha"
            >

            <button onclick="entrarAdmin()">
                Entrar
            </button>

            <p id="erro-senha"></p>

        </div>

    </main>

    <script type="module" src="firebase-config.js"></script>
    <script src="script.js"></script>

</body>

</html>
