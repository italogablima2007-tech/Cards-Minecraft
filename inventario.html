<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventário de Cartas | Reinos & Batalhas</title>
<link rel="stylesheet" href="style.css">
<style>
.grade-inventario{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.resumo-inventario{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.carta-inventario{overflow:hidden;border:1px solid var(--borda);border-radius:18px;background:var(--fundo-card);cursor:pointer;transition:.2s}
.carta-inventario:hover{transform:translateY(-5px)}
.arte-inventario{height:260px;position:relative;overflow:hidden;background:#111}
.fundo-inventario,.criatura-inventario{position:absolute;inset:0;width:100%;height:100%}
.fundo-inventario{object-fit:cover}.criatura-inventario{object-fit:contain;z-index:2}
.sombra-inventario{position:absolute;inset:0;z-index:3;background:linear-gradient(transparent 45%,rgba(0,0,0,.85))}
.badge{position:absolute;z-index:4;top:12px;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.75);font-weight:bold}
.raridade{left:12px}.quantidade{right:12px}
.nome-arte{position:absolute;z-index:4;left:14px;right:14px;bottom:12px;margin:0}
.dados-inventario{padding:14px}.linha{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.status{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status span{padding:7px;background:rgba(255,255,255,.06);border-radius:9px;text-align:center}
.vazio{grid-column:1/-1;padding:45px 20px;text-align:center;border:1px dashed var(--borda);border-radius:16px}
.modal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.8);align-items:center;justify-content:center;padding:20px}
.modal.aberto{display:flex}.modal-box{position:relative;width:min(760px,96vw);max-height:90vh;overflow:auto;background:#10151d;border:1px solid var(--borda);border-radius:18px;padding:22px}
.fechar{position:absolute;right:12px;top:12px}.habilidade{padding:12px;margin-top:10px;border-radius:12px;background:rgba(255,255,255,.05)}
.aviso{padding:12px;margin-bottom:18px;border:1px solid var(--borda);border-radius:12px}
</style>
</head>
<body id="corpo-painel">
<main class="painel-container">
<header class="topo-painel">
<div><p class="pequeno-titulo">🎴 REINOS & BATALHAS</p><h1>Inventário de Cartas</h1><p id="subtitulo">Carregando...</p></div>
<button class="botao-sair" onclick="location.href='painel.html'">← Voltar</button>
</header>
<section class="secao-painel">
<div class="titulo-secao"><h2>📚 Minhas Cartas</h2></div>
<div class="resumo-inventario">
<div class="card"><span class="icone-card">🎴</span><h2>Cartas</h2><p id="total">0</p></div>
<div class="card"><span class="icone-card">✨</span><h2>Diferentes</h2><p id="diferentes">0</p></div>
<div class="card"><span class="icone-card">👑</span><h2>Reino</h2><p id="reino">---</p></div>
</div>
<div id="aviso" class="aviso" style="display:none"></div>
<div id="grade" class="grade-inventario"></div>
</section>
</main>
<div id="modal" class="modal" onclick="if(event.target===this)fechar()"><div class="modal-box"><button class="fechar" onclick="fechar()">✕</button><div id="detalhes"></div></div></div>
<script>
const usuario=localStorage.getItem("usuarioLogado");
if(!usuario) location.href="index.html";
const reino=usuario==="Admin"?localStorage.getItem("reinoAdministrado"):usuario;
if(!reino){alert("Nenhum Reino selecionado.");location.href="painel.html";}
document.body.classList.add("tema-"+reino.toLowerCase());
document.getElementById("subtitulo").textContent="Inventário de "+reino;
document.getElementById("reino").textContent=reino;

const catalogo=JSON.parse(localStorage.getItem("cartasReinos"))||[];
const chave="inventario_"+reino;
let inventario=JSON.parse(localStorage.getItem(chave))||[];

// TESTE: enquanto não existem pacotes, coloca a primeira carta do Reino no inventário vazio.
if(!inventario.length){
 const teste=catalogo.find(c=>c.reino===reino);
 if(teste){
  inventario=[{idCarta:teste.id,quantidade:1,nivel:1,xp:0}];
  localStorage.setItem(chave,JSON.stringify(inventario));
  aviso.style.display="block";
  aviso.textContent="🧪 Teste: a primeira carta de "+reino+" foi adicionada. Depois ela será obtida pelos pacotes.";
 }
}

const cartaPorId=id=>catalogo.find(c=>String(c.id)===String(id));
const esc=t=>{const d=document.createElement("div");d.textContent=t??"";return d.innerHTML};
const criatura=c=>c.imagemCriatura||c.imagemPersonagem||c.imagem||"";
const fundo=c=>c.imagemFundo||c.fundo||c.cenario||"";

function mostrar(){
 const validos=inventario.map(i=>({i,c:cartaPorId(i.idCarta)})).filter(x=>x.c);
 total.textContent=validos.reduce((s,x)=>s+(Number(x.i.quantidade)||1),0);
 diferentes.textContent=validos.length;
 if(!validos.length){grade.innerHTML='<div class="vazio"><h3>🎴 Inventário vazio</h3><p>As cartas obtidas nos pacotes aparecerão aqui.</p></div>';return;}
 grade.innerHTML=validos.map(({i,c})=>`
 <article class="carta-inventario" onclick="abrir('${c.id}')">
  <div class="arte-inventario">
   ${fundo(c)?`<img class="fundo-inventario" src="${esc(fundo(c))}">`:""}
   ${criatura(c)?`<img class="criatura-inventario" src="${esc(criatura(c))}">`:""}
   <div class="sombra-inventario"></div>
   <span class="badge raridade">${esc(c.raridade)}</span><span class="badge quantidade">x${i.quantidade||1}</span>
   <h3 class="nome-arte">${esc(c.nome)}</h3>
  </div>
  <div class="dados-inventario"><div class="linha"><span>👑 ${esc(c.reino)}</span><span>⭐ Nível ${i.nivel||1}</span></div>
  <div class="status"><span>❤️ ${c.vida}</span><span>⚔️ ${c.ataque}</span><span>🛡️ ${c.defesa}</span><span>⚡ ${c.velocidade}</span></div></div>
 </article>`).join("");
}

function abrir(id){
 const c=cartaPorId(id),i=inventario.find(x=>String(x.idCarta)===String(id));if(!c||!i)return;
 const ats=(c.ataques||[]).map(a=>`<div class="habilidade"><h4>⚔️ ${esc(a.nome)}</h4><p>💥 ${a.danoMin}–${a.danoMax} | 🎯 ${a.precisao}% | ${esc(a.tipo)}</p>${a.efeito?`<p>✨ ${esc(a.efeito.tipo)}: ${a.efeito.valor}% por ${a.efeito.duracao} turno(s)</p>`:""}</div>`).join("");
 const pas=(c.passivas||[]).map(p=>`<div class="habilidade"><h4>⭐ ${esc(p.nome)}</h4><p>${esc(p.descricao||"")}</p>${p.efeito?`<p>✨ ${esc(p.efeito.tipo)}: ${p.efeito.valor}%</p>`:""}</div>`).join("");
 detalhes.innerHTML=`<p class="pequeno-titulo">${esc(c.raridade)} • ${esc(c.reino)}</p><h2>${esc(c.nome)}</h2><p>${esc(c.classe||"Sem classe")} • ⭐ Nível ${i.nivel||1}</p><div class="status"><span>❤️ ${c.vida}</span><span>⚔️ ${c.ataque}</span><span>🛡️ ${c.defesa}</span><span>⚡ ${c.velocidade}</span></div><h3>⚔️ Ataques</h3>${ats||"<p>Nenhum ataque.</p>"}${pas?`<h3>⭐ Passivas</h3>${pas}`:""}`;
 modal.classList.add("aberto");
}
function fechar(){modal.classList.remove("aberto")}
mostrar();
</script>
</body>
</html>
