<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar Pacote | Admin</title><link rel="stylesheet" href="style.css"><style>main{max-width:750px;margin:auto;padding:24px}.formulario{background:#111b29;border:1px solid #bca16b;border-radius:16px;padding:25px;display:grid;gap:15px}label{display:block;margin-bottom:7px}input,select{width:100%;padding:13px;border-radius:9px;border:1px solid #927a53;background:#0b121e;color:white;font-size:16px}button{padding:13px;border:0;border-radius:9px;background:#e6bc65;color:#191307;font-weight:800;cursor:pointer}button:disabled{opacity:.5}#mensagem{min-height:24px}</style></head><body id="corpo-painel"><main><header class="topo-painel"><div><p class="pequeno-titulo">⚙️ ADMIN</p><h1>🎁 Criar Pacote</h1></div><button onclick="location.href='painel.html'">← Voltar</button></header><section class="formulario"><p>Crie um presente com cartas aleatórias do catálogo e envie ao reino escolhido. O jogador receberá o pacote na aba Pacotes.</p><div><label for="nome">Nome do pacote</label><input id="nome" maxlength="70" value="Presente do Rei"></div><div><label for="quantidade">Quantidade de cartas (1 a 30)</label><input id="quantidade" type="number" min="1" max="30" value="5"></div><div><label for="destino">Destinatário</label><select id="destino"><option value="Drakmor">❄️ Drakmor</option><option value="Solaris">☀️ Solaris</option><option value="Aetheryon">☁️ Aetheryon</option><option value="Todos">🌍 Todos os reinos</option></select></div><button id="enviar">🎁 Enviar pacote</button><p id="mensagem" role="status"></p></section></main><script type="module">import './firebase-config.js?v=pacotes-20261009-2';const sessao=await window.RB.exigir();if(!sessao.admin){alert('Área exclusiva do Admin');location.replace('painel.html');throw Error('Sem acesso')}document.getElementById('enviar').onclick=async()=>{const b=document.getElementById('enviar'),msg=document.getElementById('mensagem');const nome=document.getElementById('nome').value.trim(),quantidade=Number(document.getElementById('quantidade').value),destino=document.getElementById('destino').value;if(!nome||!Number.isInteger(quantidade)||quantidade<1||quantidade>30){msg.textContent='Confira o nome e a quantidade (1 a 30).';return}if(!confirm('Enviar '+quantidade+' cartas para '+destino+'?'))return;b.disabled=true;msg.textContent='Enviando...';try{const destinos=destino==='Todos'?['Drakmor','Solaris','Aetheryon']:[destino];await window.RB.criarPacoteAdmin(nome,quantidade,destinos);msg.textContent='✅ Pacote enviado! O destinatário poderá abri-lo na aba Pacotes.'}catch(e){msg.textContent='❌ '+e.message}finally{b.disabled=false}};</script></body></html>
